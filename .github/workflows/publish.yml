name: Publish packages to npm

on:
  push:
    branches:
      - main

concurrency:
  group: "publish"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1 # has to be 1 (one) as there are dependencies between the published packages
      matrix:
        package: [ base, server, client, client-react ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@krmx'
      - name: Publish Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/${{ matrix.package }}
          echo "-- @krmx/${{ matrix.package }} --"

          LOCAL_VERSION=$(node -e "console.log(require('./package.json').version);")
          echo "Local version: $LOCAL_VERSION"

          REMOTE_VERSION=$(npm show "@krmx/${{ matrix.package }}" version)
          echo "Remote version: $REMOTE_VERSION"

          if ! ../../.github/tools/semver-greater.sh "$REMOTE_VERSION" "$LOCAL_VERSION"; then
            echo "[!!] Skipped publish as the local version of @krmx/${{ matrix.package }} is not greater than what is already published."
          else
            echo "[!!] Publishing is required."

            # Clean the npm cache before potentially installing recently published packages
            npm cache clean --force

            # Install the package dependencies
            npm ci

            # Check if there are workspace dependencies in the package.json
            if jq -e '.dependencies | to_entries[] | select(.key | startswith("@krmx/")) | select(.value == "*") | length > 0' package.json &> /dev/null; then
              echo "Found workspace dependencies in package.json, updating them now."
              jq -r '.dependencies | to_entries[] | select(.key | startswith("@krmx/")) | select(.value == "*") | .key' package.json |
              while read -r pkg; do
                version=$(npm view "$pkg" version 2>/dev/null || echo "0.0.0")
                echo "- Updating dependencies $pkg to ^$version"
                npm install $pkg@^$version --prefer-online
              done
            fi

            # Check if there are workspace dev dependencies in the package.json
            if jq -e '.devDependencies | to_entries[] | select(.key | startswith("@krmx/")) | select(.value == "*") | length > 0' package.json &> /dev/null; then
              echo "Found workspace dev dependencies in package.json, updating them now."
              jq -r '.devDependencies | to_entries[] | select(.key | startswith("@krmx/")) | select(.value == "*") | .key' package.json |
              while read -r pkg; do
                version=$(npm view "$pkg" version 2>/dev/null || echo "0.0.0")
                echo "- Updating dev dependencies $pkg to ^$version"
                npm install $pkg@^$version --save-dev --prefer-online
              done
            fi

            # Run tests and build the package
            npm run validate

            # Publish the package
            npm publish --provenance --access public
          fi 
